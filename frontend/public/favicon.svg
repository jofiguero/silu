<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Cuadrado redondeado de fondo: a 16px un contorno fino desaparece, y una
       silueta maciza sobre color plano sigue siendo reconocible. -->
  <rect width="32" height="32" rx="7" fill="#2f6f5e"/>
  <!-- El cerebro se arma con círculos superpuestos: a tamaño de pestaña lee
       como una silueta con lóbulos, sin depender de trazos delgados. -->
  <g fill="#fff">
    <circle cx="16" cy="12" r="4.6"/>
    <circle cx="11" cy="13.6" r="4.4"/>
    <circle cx="21" cy="13.6" r="4.4"/>
    <circle cx="10.6" cy="18.4" r="4"/>
    <circle cx="21.4" cy="18.4" r="4"/>
    <circle cx="16" cy="18" r="4.8"/>
    <circle cx="13.6" cy="22" r="3.1"/>
    <circle cx="18.4" cy="22" r="3.1"/>
  </g>
  <!-- La cisura central es lo que lo vuelve un cerebro y no una nube. -->
  <path d="M16 8.2v15" fill="none" stroke="#2f6f5e" stroke-width="1.7"
        stroke-linecap="round"/>
  <path d="M12.6 14.4c1.5.3 2.2 1.4 2 2.8M19.4 14.4c-1.5.3-2.2 1.4-2 2.8"
        fill="none" stroke="#2f6f5e" stroke-width="1.4" stroke-linecap="round"/>
</svg>
